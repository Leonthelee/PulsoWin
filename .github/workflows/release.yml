# PulsoWin · MIT · Co-designed with AI coding assistants (Claude & Gemini)
#
# Compila, prueba y empaqueta PulsoWin en un runner de GitHub (requisito de SignPath Foundation).
#
#   - Cualquier push o pull request: compila sin advertencias, corre las pruebas y deja el zip y el MSI como
#     artefactos del workflow (sin firma si no hay token de SignPath).
#   - Etiqueta vX.Y.Z: además crea un BORRADOR de release con los archivos. Publicarlo es siempre una decisión manual.
#
# Orden de la firma (importa por Smart App Control, error 0x800711C7):
#   1. se firman PulsoWin.exe y las DLL propias (artefacto «app»);
#   2. el MSI se arma con esos binarios ya firmados y después se firma el MSI (artefacto «msi»);
#   3. los .sha256 se calculan al final, porque firmar cambia el hash.
#
# La firma se activa sola cuando existe el secreto SIGNPATH_API_TOKEN y la variable SIGNPATH_ORGANIZATION_ID.
# Configuración de SignPath: ver docs/firma-signpath.md.

name: Build y release

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read   # SignPath descarga los artefactos de este workflow
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      # Los pull requests de forks nunca reciben secretos: ahí la firma queda apagada.
      SIGN: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' && github.event_name != 'pull_request' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      signed: ${{ env.SIGN }}
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Versión (Directory.Build.props; la etiqueta debe coincidir)
        id: version
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "La versión '$version' no es X.Y.Z numérica (el MSI la exige)." }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "La etiqueta $env:GITHUB_REF_NAME no coincide con <Version>$version</Version> de Directory.Build.props."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "Versión $version · firma: $env:SIGN"

      - name: Compilar sin advertencias
        run: dotnet build PulsoWin.slnx -c Release --no-incremental -warnaserror

      - name: Pruebas
        run: dotnet test PulsoWin.slnx -c Release --no-build --logger "console;verbosity=normal"

      - name: Publicar (autocontenido, win-x64)
        run: >
          dotnet publish src/PulsoWin.App -c Release -r win-x64 --self-contained true
          -p:DebugType=none -o artifacts/publish/app

      # ---------- 1. Firma de los binarios propios (antes del MSI) ----------
      - name: Subir binarios sin firmar
        id: upload-app
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-sin-firmar
          path: artifacts/publish/app/
          if-no-files-found: error
          retention-days: 3

      - name: Firmar binarios (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'PulsoWin' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: artifacts/signed/app

      - name: Elegir binarios para empaquetar
        id: bin
        run: |
          $dir = if ($env:SIGN -eq 'true') { 'artifacts/signed/app' } else { 'artifacts/publish/app' }
          $dir = (Resolve-Path $dir).Path
          "dir=$dir" >> $env:GITHUB_OUTPUT
          if ($env:SIGN -eq 'true') {
            # Si un binario propio quedó sin firma, el release no sirve contra Smart App Control: se detiene aquí.
            $own = Get-ChildItem $dir -Recurse -Include 'PulsoWin.exe', 'PulsoWin*.dll'
            $bad = $own | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
            if (-not $own -or $bad) { throw "Sin firma válida: $($bad.Name -join ', ')" }
            $own | ForEach-Object { "{0}: {1}" -f $_.Name, (Get-AuthenticodeSignature $_.FullName).SignerCertificate.Subject }
          }

      # ---------- 2. MSI con los binarios ya firmados, y luego firma del MSI ----------
      - name: Armar MSI
        run: >
          dotnet build installer/PulsoWin.Installer.wixproj -c Release
          "-p:Version=${{ steps.version.outputs.version }}"
          "-p:PublishDir=${{ steps.bin.outputs.dir }}"
          -o artifacts/msi

      - name: Subir MSI sin firmar
        id: upload-msi
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi-sin-firmar
          path: artifacts/msi/PulsoWin-${{ steps.version.outputs.version }}-x64.msi
          if-no-files-found: error
          retention-days: 3

      - name: Firmar MSI (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'PulsoWin' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: msi
          github-artifact-id: ${{ steps.upload-msi.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: artifacts/signed/msi

      # ---------- 3. Zip portable, hashes (al final) ----------
      - name: Zip portable y SHA-256
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BIN: ${{ steps.bin.outputs.dir }}
        run: |
          $out = New-Item -ItemType Directory -Force artifacts/release
          $msi = if ($env:SIGN -eq 'true') { "artifacts/signed/msi/PulsoWin-$env:VERSION-x64.msi" } else { "artifacts/msi/PulsoWin-$env:VERSION-x64.msi" }
          Copy-Item $msi $out

          $stage = Join-Path $env:RUNNER_TEMP "PulsoWin-$env:VERSION"
          Copy-Item $env:BIN $stage -Recurse
          Copy-Item README.md, LICENSE, AUTHORS.md, CHANGELOG.md $stage
          (Get-Content installer/LEEME.txt -Raw).Replace('{{VERSION}}', $env:VERSION) |
            Set-Content (Join-Path $stage 'LEEME.txt') -Encoding utf8BOM -NoNewline
          Compress-Archive -Path $stage -DestinationPath (Join-Path $out "PulsoWin-$env:VERSION-win-x64.zip") -CompressionLevel Optimal

          Get-ChildItem $out -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            [IO.File]::WriteAllText("$($_.FullName).sha256", "$hash  $($_.Name)`n")   # LF: sirve para sha256sum -c
            "{0}  {1}  ({2:N1} MB)" -f $hash, $_.Name, ($_.Length / 1MB)
          }

      - name: Subir paquete
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PulsoWin-${{ steps.version.outputs.version }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14

  draft-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # solo este job puede crear el borrador
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: PulsoWin-${{ needs.build.outputs.version }}
          path: release

      - name: Verificar hashes
        working-directory: release
        run: sha256sum -c *.sha256

      - name: Crear borrador de release (se publica a mano)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          if [ "$SIGNED" = "true" ]; then firma="Binarios y MSI firmados con SignPath Foundation."; else firma="⚠️ Compilación SIN firma digital."; fi
          printf 'Borrador generado por GitHub Actions (%s). %s\n\nCompleta las notas antes de publicar. Historial: [CHANGELOG](https://github.com/%s/blob/main/CHANGELOG.md).\n' \
            "$GITHUB_SHA" "$firma" "$GITHUB_REPOSITORY" > notas.md
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" \
            --draft --prerelease --verify-tag --title "PulsoWin $VERSION" --notes-file notas.md
